# 构建并部署到 GitHub Pages（本仓库直接部署，Actions 模式）
#
# 触发：push 到 main 自动部署；Actions 页面可手动 Run workflow。
# 依赖：仓库需公开（或账号为付费计划），Settings → Pages → Source = GitHub Actions，
#       自定义域名 doc.banzheshenghuo.com 已通过 API 配置在 Pages 设置中。
# DNS：doc 记录 CNAME 至 banzhenghuo.github.io（仅 DNS，不开代理）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
